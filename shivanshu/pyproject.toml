[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polymer-classifier"
version = "2.0.0"
description = "State-of-the-Art Deep Learning Framework for Plastic Polymer Resin Classification"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Engineering"}
]
keywords = [
    "deep-learning",
    "pytorch",
    "computer-vision",
    "polymer-classification",
    "plastics-recycling",
    "convnext",
    "circular-economy"
]
dependencies = [
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
polymer-classify = "classify:main"
polymer-train = "train:main"
polymer-evaluate = "evaluate:main"
